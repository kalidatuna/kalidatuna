Score each from 1–5 on frequency, boredom, how rule-based it is, and how low-risk mistakes would be. Rank them. For the top 2, describe the trigger and actions for an automation, recommend a beginner-friendly tool (e.g. Zapier, Make, n8n, Apple Shortcuts, Power Automate), and estimate the time saved.'''

[[prompts]]
slug = "automation-ai-step"
title = "Reliable AI step for an automation"
category = "Automation"
description = "A structured-output prompt template for Zapier, Make or n8n."
free = false
tags = ["automation", "json"]
prompt = '''You are a step in an automated workflow. Read the input below and reply with JSON only, no other text:
{"summary": string (one sentence), "category": one of ["billing","booking","question","complaint","other"], "urgency": one of ["high","medium","low"], "suggested_reply": string (2–3 friendly sentences)}
If you are unsure about a field, use "other" or "medium". Never invent facts not in the input.

Input: {{input}}'''

[[prompts]]
slug = "receipt-extractor"
title = "Receipt data extractor"
category = "Automation"
description = "Pull vendor, date, total and category from receipts."
free = false
tags = ["automation", "money"]
prompt = '''Extract the following from this receipt and reply with JSON only:
{"vendor": string, "date": "YYYY-MM-DD", "total": number, "currency": string, "category": one of ["groceries","transport","bills","eating out","household","other"]}
If a field is missing or unreadable, use null. Receipt: [paste text or attach image]'''

[[prompts]]
slug = "morning-briefing"
title = "Scheduled morning briefing"
category = "Automation"
description = "A daily briefing to schedule in your assistant."
free = true
tags = ["scheduled", "productivity"]
prompt = '''Every weekday at [time]: give me a briefing under 150 words: today's weather in [city], my calendar for today (if connected), the one thing I should prepare for, and a short encouraging note. On Mondays, also list my top 3 priorities for the week based on my calendar.'''

[[prompts]]
slug = "skill-from-chat"
title = "Turn this chat into a reusable skill"
category = "Automation"
description = "Capture a successful conversation as a skill or template."
free = false
tags = ["skills", "templates"]
prompt = '''That worked really well. Turn this whole conversation into a reusable skill I can save: include a name, when to use it, the inputs I need to provide, step-by-step instructions, the output format, a quality checklist, and a short example. Write it so it works when pasted into a new chat or saved as a custom assistant / skill.'''

[[prompts]]
slug = "custom-assistant-builder"
title = "Custom assistant instructions writer"
category = "Automation"
description = "Draft instructions for a custom GPT, Gem or Claude Project."
free = false
tags = ["skills", "custom-gpt"]
prompt = '''I want a custom assistant that [job]. Interview me (one question at a time, max 6) about the audience, process, tone, output format and edge cases. Then write complete instructions with sections: PURPOSE, PROCESS (numbered steps), TONE, FORMAT, WHEN UNSURE, NEVER. Finally, give me 5 test cases including awkward ones.'''

[[prompts]]
slug = "vibe-code-tool"
title = "Build me a tiny app"
category = "Automation"
description = "A vibe-coding starter prompt for a personal tool."
free = false
tags = ["vibe-coding", "apps"]
prompt = '''Build a simple, mobile-friendly web app that [what it does] for [who].
Features:
- [feature 1]
- [feature 2]
- [feature 3]
Data should be saved in the browser. Design: [style, colours, large text]. Start with the simplest version that works, then tell me 3 improvements we could make next.'''

[[prompts]]
slug = "scam-checker"
title = "Is this a scam?"
category = "Safety"
description = "Analyse a suspicious message safely."
free = true
tags = ["safety", "scams"]
prompt = '''I received this message (personal details removed): [paste]. Does it show signs of a scam? List the warning signs, what a legitimate version would look like, and how I can verify it safely without using any links or numbers in the message.'''

[[prompts]]
slug = "fact-check-claims"
title = "Confidence check on an answer"
category = "Safety"
description = "Make the AI flag what it's unsure about."
free = true
tags = ["safety", "verification"]
prompt = '''List every factual claim in your last answer. For each one, rate your confidence (high/medium/low), explain why, and tell me exactly how I could verify it. Then point out anything you may have guessed or generalised.'''

[[prompts]]
slug = "redact-helper"
title = "Redact before sharing"
category = "Safety"
description = "Spot personal details to remove from a document."
free = false
tags = ["privacy", "documents"]
prompt = '''I'm about to share a document with an AI tool. Without repeating any sensitive values back to me, list the types of personal or sensitive information I should remove (names, addresses, account numbers, ID numbers, dates of birth, etc.) and where they appear (by section or line). Suggest placeholder labels like [NAME] and [ACCOUNT].'''

[[prompts]]
slug = "family-ai-agreement"
title = "Family AI agreement"
category = "Safety"
description = "Friendly ground rules for the whole household."
free = false
tags = ["family", "kids"]
prompt = '''Help us write a friendly one-page family agreement about using AI. Our family: [ages]. Cover homework (tutor, not ghostwriter), privacy, checking facts, what to do if something seems wrong or upsetting, screen time, and safe words for phone calls. Positive tone, short sentences, room for everyone to sign.'''

[[prompts]]
slug = "deep-research-brief"
title = "Deep research brief"
category = "Thinking & Decisions"
description = "Brief a research mode like a professional researcher."
free = false
tags = ["research", "power-user"]
prompt = '''Research question: [question]
Context: I'm [who] and I need this to [decision/purpose].
Cover: [aspects].
Prioritise official, primary and recent sources (within [timeframe]). Separate established facts from opinions and estimates, note where sources disagree, and finish with what's still uncertain and how I could find out. Format: summary first, then details, then a checklist of next steps.'''

[[prompts]]
slug = "ninety-day-plan"
title = "My 90-day AI plan"
category = "Essentials"
description = "Turn what you've learned into habits and systems."
free = false
tags = ["habits", "planning"]
prompt = '''Here's my situation: [job, family, goals, time available]. Tasks that drain me: [list]. Things I'd love to achieve this year: [list].
Create my personal 90-day AI plan: Days 1–30 a daily micro-habit and 10 tasks to try; Days 31–60 two skills/custom assistants and one automation to build, with first steps; Days 61–90 one ambitious project in weekly milestones. Add a weekly check-in question.'''
