free = false
tags = ["email", "work"]
prompt = '''Write a short follow-up to [person] about [topic]. I last contacted them on [date] and haven't heard back. I need [specific thing] by [deadline] because [reason]. Tone: friendly, assumes good intent, makes it easy to reply. Under 70 words, with a clear question at the end.'''

[[prompts]]
slug = "complaint-letter"
