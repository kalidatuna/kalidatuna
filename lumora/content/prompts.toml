# Lumora Prompt Library. Fill in the [brackets]. `free = true` items are visible to everyone.

[[prompts]]
slug = "brief-anything"
title = "The BRIEF master prompt"
category = "Essentials"
description = "A universal template that works for almost any request."
free = true
tags = ["template", "beginner"]
prompt = '''Background: [the situation, who's involved, what's happened so far]
Role: Act as [an expert editor / a friendly coach / a travel planner / ...]
Intent: I need you to [specific task] so that [the outcome I want].
Examples: Here's something similar I like: [optional example]
Format: [length, structure, tone]. Don't [things to avoid].
If anything is unclear, ask me up to 3 questions before you start.'''

[[prompts]]
slug = "interview-me"
title = "Interview me first"
category = "Essentials"
description = "Let the AI ask the questions so it understands your situation before helping."
free = true
tags = ["planning", "beginner"]
prompt = '''I want help with [goal]. Before suggesting anything, interview me. Ask one question at a time (maximum 6). After my last answer, summarise what you've learned in 3 bullet points and then give me a tailored plan with a first step I can do in 10 minutes.'''

[[prompts]]
slug = "explain-like-im-new"
title = "Explain it at my level"
category = "Learning"
description = "Get a clear explanation of any topic, then check your understanding."
free = true
tags = ["learning", "explain"]
prompt = '''Explain [topic] to me. I'm [your background, e.g. "a beginner with no maths background"].
1. Start with a one-paragraph explanation using an everyday analogy.
2. Then list the 5 key terms I'll come across, one sentence each.
3. Finish with one question to check I've understood. Wait for my answer.'''

[[prompts]]
slug = "calm-reply"
title = "Calm reply to a difficult message"
category = "Writing"
description = "Turn frustration into a firm, kind response."
free = true
tags = ["email", "conflict"]
prompt = '''Here's a message I received: [paste].
Honestly, I feel [how you feel] because [reason]. The outcome I want is [outcome].
Draft a calm, professional reply that's firm but kind, under [N] words. Then give me a shorter alternative. Don't apologise for things that aren't my fault.'''

[[prompts]]
slug = "polite-no"
title = "Say no politely"
category = "Writing"
description = "Decline a request without damaging the relationship."
free = true
tags = ["email", "boundaries"]
prompt = '''Help me say no to [request] from [person/relationship]. Reason (only share if appropriate): [reason]. I'd like to [offer an alternative / keep the door open / close it firmly]. Write 3 versions: very warm, neutral, and brief. Each under 80 words.'''

[[prompts]]
slug = "sound-like-me"
title = "Learn my writing style"
category = "Writing"
description = "Teach the AI to write in your voice."
free = false
tags = ["style", "personalisation"]
prompt = '''Here are 3 examples of my writing: [paste].
Analyse my style: sentence length, vocabulary, humour, formality, structure and any habits. Summarise it as 6 bullet points I can save as instructions. Then rewrite this draft in my style: [paste draft]. Point out any phrases that still sound generic.'''

[[prompts]]
slug = "follow-up-chaser"
