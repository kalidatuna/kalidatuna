[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "afterglow"
version = "0.1.0"
description = "GPU motion-graphics and compositing engine with an MCP server, built for AI-driven short-form video editing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "moderngl>=5.10",
    "av>=12",
    "numpy>=1.26",
    "pillow>=10",
    "mcp>=1.2",
]

[project.scripts]
afterglow-mcp = "afterglow.server:main"
afterglow = "afterglow.cli:main"

[tool.setuptools.packages.find]
include = ["afterglow*"]

