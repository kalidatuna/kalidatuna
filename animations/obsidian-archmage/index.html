<head>

<body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const W = 1280, H = 720, DURATION = 10;

// ---------- helpers ----------
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(1337);
const clamp01 = x => Math.min(1, Math.max(0, x));
const ss = (a, b, t) => { const x = clamp01((t - a) / (b - a)); return x * x * (3 - 2 * x); };
const lerp = (a, b, k) => a + (b - a) * k;
const easeOut = x => 1 - Math.pow(1 - clamp01(x), 3);

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x06040b);
scene.fog = new THREE.FogExp2(0x0a0614, 0.055);

scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.22;
const camera = new THREE.PerspectiveCamera(38, W / H, 0.05, 200);
scene.add(camera);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 0.8, 0.5, 0.78);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ---------- textures ----------
function canvasTex(size, draw) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const glowTex = canvasTex(128, (g, s) => {
  const gr = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.55)');
  gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, s, s);
});
const runeTex = canvasTex(1024, (g, s) => {
  const r = mulberry32(77), c = s / 2;
  g.strokeStyle = '#fff'; g.fillStyle = '#fff'; g.lineCap = 'round';
  const ring = (rad, w) => { g.lineWidth = w; g.beginPath(); g.arc(c, c, rad, 0, Math.PI * 2); g.stroke(); };
  ring(495, 6); ring(470, 3); ring(380, 4); ring(360, 2); ring(220, 5); ring(120, 3);
  // seven-pointed star
  g.lineWidth = 4; g.beginPath();
  for (let i = 0; i <= 7; i++) { const a = -Math.PI/2 + i * (Math.PI * 2 * 3 / 7); const x = c + Math.cos(a) * 360, y = c + Math.sin(a) * 360; i ? g.lineTo(x, y) : g.moveTo(x, y); }
  g.stroke();
  // inner triangle pair
  g.lineWidth = 3;
  for (const off of [0, Math.PI]) { g.beginPath(); for (let i = 0; i <= 3; i++) { const a = off - Math.PI/2 + i * Math.PI * 2 / 3; const x = c + Math.cos(a) * 215, y = c + Math.sin(a) * 215; i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke(); }
  // glyph band
  const glyph = (cx, cy, sz, rot) => {
    g.save(); g.translate(cx, cy); g.rotate(rot); g.lineWidth = 3; g.beginPath();
    const n = 2 + Math.floor(r() * 3);
    for (let k = 0; k < n; k++) { g.moveTo((r() - .5) * sz, (r() - .5) * sz); g.lineTo((r() - .5) * sz, (r() - .5) * sz); }
    if (r() > .5) { g.moveTo(sz * .3, 0); g.arc(0, 0, sz * .3, 0, Math.PI * (1 + r())); }
    g.stroke(); g.restore();
  };
  for (let i = 0; i < 40; i++) { const a = i / 40 * Math.PI * 2; glyph(c + Math.cos(a) * 425, c + Math.sin(a) * 425, 34, a + Math.PI / 2); }
  for (let i = 0; i < 18; i++) { const a = i / 18 * Math.PI * 2; glyph(c + Math.cos(a) * 290, c + Math.sin(a) * 290, 30, a + Math.PI / 2); }
  for (let i = 0; i < 7; i++) { const a = -Math.PI/2 + i / 7 * Math.PI * 2; g.beginPath(); g.arc(c + Math.cos(a) * 360, c + Math.sin(a) * 360, 16, 0, Math.PI * 2); g.lineWidth = 4; g.stroke(); }
  g.beginPath(); g.arc(c, c, 18, 0, Math.PI * 2); g.fill();
});
const stoneTex = canvasTex(512, (g, s) => {
  const r = mulberry32(5);
  g.fillStyle = '#2a2530'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 9000; i++) { const v = 30 + r() * 40 | 0; g.fillStyle = `rgba(${v},${v - 4},${v + 6},0.35)`; g.fillRect(r() * s, r() * s, 2 + r() * 4, 2 + r() * 4); }
  g.strokeStyle = 'rgba(8,6,10,0.9)'; g.lineWidth = 3;
  for (let i = 0; i <= 4; i++) { g.beginPath(); g.moveTo(0, i * s / 4); g.lineTo(s, i * s / 4); g.stroke(); g.beginPath(); g.moveTo(i * s / 4 + (i % 2) * 20, 0); g.lineTo(i * s / 4, s); g.stroke(); }
  g.lineWidth = 1.5;
  for (let i = 0; i < 14; i++) { let x = r() * s, y = r() * s; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 6; k++) { x += (r() - .5) * 60; y += (r() - .5) * 60; g.lineTo(x, y); } g.stroke(); }
});
stoneTex.wrapS = stoneTex.wrapT = THREE.RepeatWrapping; stoneTex.repeat.set(10, 10);

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x5a4a82, 0x080510, 1.1));
const rim = new THREE.DirectionalLight(0x86d4ff, 3.2);
rim.position.set(-4, 7, -7); rim.castShadow = true;
rim.shadow.mapSize.set(1024, 1024);
Object.assign(rim.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 30 });
scene.add(rim);
const key = new THREE.DirectionalLight(0xffa868, 1.5); key.position.set(5, 3, 6); scene.add(key);
const orbLight = new THREE.PointLight(0xb070ff, 0, 18, 1.6); scene.add(orbLight);
const runeLight = new THREE.PointLight(0x9a5cff, 0, 14, 1.6); runeLight.position.set(0, 0.6, 1.9); scene.add(runeLight);

// ---------- environment ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(40, 96),
  new THREE.MeshStandardMaterial({ map: stoneTex, color: 0x8a8098, roughness: 0.92, metalness: 0.05 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// raised dais
const dais = new THREE.Mesh(new THREE.CylinderGeometry(2.6, 2.8, 0.25, 64),
  new THREE.MeshStandardMaterial({ map: stoneTex, color: 0x6a6078, roughness: 0.85 }));
dais.position.y = 0.125; dais.receiveShadow = true; dais.castShadow = true; scene.add(dais);

const pillarMat = new THREE.MeshStandardMaterial({ color: 0x2b2533, roughness: 0.9 });
for (let i = 0; i < 9; i++) {
  const a = Math.PI * 1.08 + i / 8 * Math.PI * 0.84, h = 3 + rand() * 5;
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, h, 10), pillarMat);
  p.position.set(Math.cos(a) * 10, h / 2, Math.sin(a) * 9 - 1);
  p.rotation.z = (rand() - .5) * 0.12; p.castShadow = true; scene.add(p);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.35, 1.4), pillarMat);
  cap.position.set(p.position.x, h + 0.1, p.position.z); cap.rotation.y = rand(); if (h > 5) scene.add(cap);
}
// distant moon glow
const moon = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(0x6a4cc0).multiplyScalar(0.4), blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
moon.scale.set(30, 30, 1); moon.position.set(-6, 10, -40); scene.add(moon);

// floating debris
const rockMat = new THREE.MeshStandardMaterial({ color: 0x3a3442, roughness: 0.8, flatShading: true });
const rocks = [];
for (let i = 0; i < 18; i++) {
  const sz = 0.08 + rand() * 0.28;
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(sz, 0), rockMat);
  const a = rand() * Math.PI * 2, rr = 1.6 + rand() * 2.6;
  m.userData = { a, rr, sz, rise: 0.8 + rand() * 2.6, delay: rand() * 1.5, spin: new THREE.Vector3(rand(), rand(), rand()), ph: rand() * 6 };
  m.castShadow = true; scene.add(m); rocks.push(m);
}

// ---------- the Archmage ----------
const mage = new THREE.Group(); mage.position.y = 0.25; scene.add(mage);
const robeMat = new THREE.MeshStandardMaterial({ color: 0x4a0a16, roughness: 0.75, metalness: 0.05 });
const ironMat = new THREE.MeshStandardMaterial({ color: 0x1c1a20, roughness: 0.32, metalness: 0.9 });
const goldMat = new THREE.MeshStandardMaterial({ color: 0xb08a3e, roughness: 0.38, metalness: 1.0 });
const obsidianMat = new THREE.MeshStandardMaterial({ color: 0x0b0a0e, roughness: 0.12, metalness: 0.85, flatShading: true });
const capeMat = new THREE.MeshStandardMaterial({ color: 0x12081c, roughness: 0.7, side: THREE.DoubleSide });
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xc58cff });
const gemMat = new THREE.MeshBasicMaterial({ color: 0xc58cff });
const add = (parent, geo, mat, pos, rot) => { const m = new THREE.Mesh(geo, mat); if (pos) m.position.set(...pos); if (rot) m.rotation.set(...rot); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m; };
const V2 = (x, y) => new THREE.Vector2(x, y);

// robe skirt
add(mage, new THREE.LatheGeometry([V2(0.001, 0), V2(0.98, 0.0), V2(0.9, 0.25), V2(0.66, 0.85), V2(0.47, 1.38), V2(0.39, 1.6)], 48), robeMat);
add(mage, new THREE.TorusGeometry(0.955, 0.035, 8, 64), goldMat, [0, 0.06, 0], [Math.PI / 2, 0, 0]);
// front robe panel with gold trim
add(mage, new THREE.BoxGeometry(0.06, 1.3, 0.02), goldMat, [0, 0.72, 0.72], [-0.34, 0, 0]);
// torso armour
add(mage, new THREE.LatheGeometry([V2(0.38, 1.52), V2(0.46, 1.78), V2(0.52, 2.04), V2(0.44, 2.26), V2(0.2, 2.38), V2(0.001, 2.4)], 40), ironMat);
add(mage, new THREE.TorusGeometry(0.41, 0.045, 8, 48), goldMat, [0, 1.56, 0], [Math.PI / 2, 0, 0]);
add(mage, new THREE.TorusGeometry(0.5, 0.025, 8, 48), goldMat, [0, 2.0, 0], [Math.PI / 2, 0, 0]);
const gem = add(mage, new THREE.OctahedronGeometry(0.08, 0), gemMat, [0, 1.95, 0.5]); gem.scale.set(0.8, 1.4, 0.5);
// pauldrons
for (const s of [-1, 1]) {
  const p = add(mage, new THREE.SphereGeometry(0.27, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), goldMat, [s * 0.55, 2.22, 0]);
  p.scale.set(1.15, 0.8, 1.05); p.rotation.z = -s * 0.35;
  for (let k = 0; k < 3; k++) {
    const sp = add(mage, new THREE.ConeGeometry(0.035, 0.26, 6), ironMat, [s * (0.5 + k * 0.09), 2.38 - k * 0.04, -0.05 + k * 0.03]);
    sp.rotation.z = -s * (0.5 + k * 0.25);
  }
}
// high shard collar
for (let i = 0; i < 7; i++) {
  const a = Math.PI + (i - 3) * 0.33;
  const c = add(mage, new THREE.ConeGeometry(0.05, 0.5 - Math.abs(i - 3) * 0.06, 4), ironMat, [Math.sin(a) * 0.25, 2.55, Math.cos(a) * 0.25 + 0.02]);
  c.rotation.set(Math.cos(a) * 0.35, 0, -Math.sin(a) * 0.35);
}
// head: faceted obsidian mask + gold crown
const head = new THREE.Group(); head.position.set(0, 2.66, 0.02); mage.add(head);
const mask = add(head, new THREE.IcosahedronGeometry(0.24, 1), obsidianMat); mask.scale.set(0.82, 1.12, 0.92);
add(head, new THREE.BoxGeometry(0.012, 0.22, 0.02), goldMat, [0, -0.02, 0.215]);
for (const s of [-1, 1]) {
  const e = add(head, new THREE.BoxGeometry(0.085, 0.02, 0.03), eyeMat, [s * 0.075, 0.035, 0.192]);
  e.rotation.set(0, s * 0.35, s * 0.32); e.castShadow = false;
}
add(head, new THREE.TorusGeometry(0.19, 0.022, 6, 32), goldMat, [0, 0.16, 0], [Math.PI / 2 + 0.12, 0, 0]);
for (let i = 0; i < 7; i++) {
  const a = (i - 3) * 0.42, h = 0.3 - Math.abs(i - 3) * 0.06;
  const c = add(head, new THREE.ConeGeometry(0.024, h, 5), goldMat, [Math.sin(a) * 0.19, 0.17 + h / 2, Math.cos(a) * 0.19 - 0.02]);
  c.rotation.set(Math.cos(a) * 0.3, 0, -Math.sin(a) * 0.3);
}
const crownGem = add(head, new THREE.OctahedronGeometry(0.03, 0), gemMat, [0, 0.21, 0.2]); crownGem.scale.y = 1.6;

// arms
function makeArm(s) {
  const shoulder = new THREE.Group(); shoulder.position.set(s * 0.52, 2.2, 0); mage.add(shoulder);
  add(shoulder, new THREE.CylinderGeometry(0.11, 0.17, 0.58, 14, 1, true), robeMat, [0, -0.29, 0]);
  const elbow = new THREE.Group(); elbow.position.y = -0.56; shoulder.add(elbow);
  add(elbow, new THREE.CylinderGeometry(0.1, 0.08, 0.42, 12), goldMat, [0, -0.21, 0]);
  add(elbow, new THREE.TorusGeometry(0.1, 0.02, 6, 20), ironMat, [0, -0.02, 0], [Math.PI / 2, 0, 0]);
  const hand = add(elbow, new THREE.SphereGeometry(0.085, 14, 10), ironMat, [0, -0.47, 0]);
  hand.scale.set(0.8, 1.1, 0.6);
  for (let k = 0; k < 4; k++) { const cl = add(hand, new THREE.ConeGeometry(0.015, 0.12, 4), ironMat, [(k - 1.5) * 0.04, -0.1, 0.02]); cl.rotation.x = Math.PI; }
  const handGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xb070ff, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0 }));
  handGlow.scale.set(0.32, 0.32, 1); hand.add(handGlow);
  return { s, shoulder, elbow, hand, handGlow };
}
const arms = [makeArm(-1), makeArm(1)];

// cape
const capeGeo = new THREE.PlaneGeometry(1.3, 2.15, 22, 34);
const capeBase = capeGeo.attributes.position.array.slice();
const cape = new THREE.Mesh(capeGeo, capeMat); cape.castShadow = true; mage.add(cape);

// ---------- magic ----------
const additive = (color, opts = {}) => new THREE.MeshBasicMaterial({ color, map: opts.map || null, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, opacity: 0, fog: false });
const runeGround = new THREE.Mesh(new THREE.PlaneGeometry(5.2, 5.2), additive(new THREE.Color(0x9a5cff).multiplyScalar(2.2), { map: runeTex }));
runeGround.rotation.x = -Math.PI / 2; runeGround.position.y = 0.27; scene.add(runeGround);
const runeGround2 = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 8.5), additive(new THREE.Color(0x4ac8ff).multiplyScalar(1.2), { map: runeTex }));
runeGround2.rotation.x = -Math.PI / 2; runeGround2.position.y = 0.02; scene.add(runeGround2);
const seal = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 1.15), additive(new THREE.Color(0xd8a8ff).multiplyScalar(1.8), { map: runeTex }));
scene.add(seal);

const ORB_POS = new THREE.Vector3(0, 2.08, 1.22);
const orb = new THREE.Group(); orb.position.copy(ORB_POS); scene.add(orb);
const orbCore = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xf4e8ff).multiplyScalar(1.8) }));
orb.add(orbCore);
const orbShell = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5, 1), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xa060ff).multiplyScalar(2.5), wireframe: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
orb.add(orbShell);
const orbShell2 = new THREE.Mesh(new THREE.IcosahedronGeometry(1.9, 0), new THREE.MeshBasicMaterial({ color: new THREE.Color(0x50c8ff).multiplyScalar(2), wireframe: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
orb.add(orbShell2);
const orbGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: new THREE.Color(0xa060ff).multiplyScalar(0.45), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
orbGlow.scale.set(2.6, 2.6, 1); orb.add(orbGlow);

// particle systems
function makePoints(n, size) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('color', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ size, map: glowTex, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true, fog: false }));
  p.frustumCulled = false; scene.add(p); return p;
}
const N_SPIRAL = 2600, N_EMBER = 500;
const spiral = makePoints(N_SPIRAL, 0.07);
const spiralSeed = Array.from({ length: N_SPIRAL }, () => ({ a: rand() * Math.PI * 2, r: 1.5 + rand() * 4.5, h: rand() * 4.5, sp: 0.25 + rand() * 0.45, off: rand(), hue: rand(), dir: new THREE.Vector3(rand() - .5, (rand() - .3) * 0.8, rand() - .5).normalize(), bsp: 4 + rand() * 12 }));
const embers = makePoints(N_EMBER, 0.05);
const emberSeed = Array.from({ length: N_EMBER }, () => ({ x: (rand() - .5) * 16, z: (rand() - .5) * 12 - 1, sp: 0.15 + rand() * 0.4, off: rand(), sway: rand() * 6, warm: rand() }));

// lightning
const boltMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xe6d0ff).multiplyScalar(5), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
const bolts = Array.from({ length: 5 }, () => { const m = new THREE.Mesh(new THREE.BufferGeometry(), boltMat); m.frustumCulled = false; scene.add(m); return m; });

// shockwave + overlays
const shock = new THREE.Mesh(new THREE.RingGeometry(0.85, 1, 128), additive(new THREE.Color(0xb88cff).multiplyScalar(3)));
shock.rotation.x = -Math.PI / 2; shock.position.y = 0.3; scene.add(shock);
const shock2 = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 96), additive(new THREE.Color(0x6ad8ff).multiplyScalar(3)));
shock2.position.copy(ORB_POS); scene.add(shock2);
const overlay = (color, order) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(4, 4), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthTest: false, depthWrite: false, fog: false, toneMapped: false })); m.position.z = -0.2; m.renderOrder = order; camera.add(m); return m; };
const flash = overlay(0xf0e0ff, 998);
const fade = overlay(0x000000, 999);

// title card
const titleTex = canvasTex(1024, (g, s) => {
  g.textAlign = 'center'; g.fillStyle = '#e9dcff';
  g.font = '600 54px "DejaVu Serif", Georgia, serif';
  g.shadowColor = '#9a5cff'; g.shadowBlur = 18;
  const text = 'THE  OBSIDIAN  ARCHMAGE';
  g.save(); g.translate(s / 2, s / 2); g.scale(0.92, 1); g.fillText(text, 0, 0); g.restore();
  g.font = 'italic 28px "DejaVu Serif", Georgia, serif'; g.fillStyle = '#b9a4e0'; g.shadowBlur = 12;
  g.fillText('kneel, or be unmade', s / 2, s / 2 + 56);
});
const title = new THREE.Mesh(new THREE.PlaneGeometry(0.2, 0.2), new THREE.MeshBasicMaterial({ map: titleTex, color: 0x9a90a8, transparent: true, opacity: 0, depthTest: false, depthWrite: false, fog: false, toneMapped: false }));
title.position.set(0, -0.035, -0.19); title.renderOrder = 997; camera.add(title);

// ---------- animation ----------
const tmpV = new THREE.Vector3(), tmpV2 = new THREE.Vector3();
const camKeys = [
  { t: 0.0, p: [0.4, 1.0, 11.5], l: [0, 2.3, 0] },
  { t: 3.4, p: [-2.6, 1.5, 7.4], l: [0, 2.15, 0] },
  { t: 7.45, p: [-2.7, 2.35, 5.0], l: [0, 2.2, 0.4] },
  { t: 8.2, p: [-2.0, 2.1, 6.4], l: [0, 2.1, 0.3] },
  { t: 10.0, p: [0.9, 1.6, 7.0], l: [0, 2.2, 0] },
];
function cameraAt(t) {
  let i = 0; while (i < camKeys.length - 2 && t > camKeys[i + 1].t) i++;
  const a = camKeys[i], b = camKeys[i + 1];
  const k = ss(a.t, b.t, t);
  const p = a.p.map((v, j) => lerp(v, b.p[j], k)), l = a.l.map((v, j) => lerp(v, b.l[j], k));
  const shake = Math.max(0, 1 - (t - 7.6) / 1.2) * (t > 7.6 ? 1 : 0) * 0.09 + ss(6.0, 7.5, t) * (t < 7.6 ? 0.012 : 0);
  camera.position.set(p[0] + Math.sin(t * 61) * shake, p[1] + Math.sin(t * 47 + 1) * shake, p[2] + Math.sin(t * 53 + 2) * shake * 0.5);
  camera.lookAt(l[0], l[1], l[2]);
}

// arm poses: [shoulderX, shoulderOut, elbowX]
const poses = { idle: [0.08, 0.12, -0.12], summon: [-0.35, 1.85, -0.45], cast: [-1.32, -0.36, -0.42], thrust: [-1.52, -0.18, -0.05], after: [-0.9, -0.1, -0.5] };
function armPose(t) {
  const seq = [[0, 'idle'], [1.3, 'idle'], [2.4, 'summon'], [3.6, 'summon'], [4.6, 'cast'], [7.4, 'cast'], [7.62, 'thrust'], [8.6, 'thrust'], [9.8, 'after']];
  let i = 0; while (i < seq.length - 2 && t > seq[i + 1][0]) i++;
  const [ta, pa] = seq[i], [tb, pb] = seq[i + 1];
  const k = ss(ta, tb, t);
  return poses[pa].map((v, j) => lerp(v, poses[pb][j], k));
}

function boltGeometry(from, to, seed, amp) {
  const r = mulberry32(seed), pts = [], n = 12;
  for (let i = 0; i <= n; i++) {
    const s = i / n, p = from.clone().lerp(to, s), w = Math.sin(Math.PI * s) * amp;
    p.x += (r() - .5) * w; p.y += (r() - .5) * w; p.z += (r() - .5) * w; pts.push(p);
  }
  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 36, 0.009, 4, false);
}

function renderAt(t) {
  const blastT = t - 7.6, blasted = blastT > 0;
  // camera
  cameraAt(t);

  // breathing / hover
  mage.position.y = 0.25 + ss(2.0, 4.0, t) * 0.18 + Math.sin(t * 1.6) * 0.02 * ss(2, 4, t) - (blasted ? Math.max(0, 0.06 - blastT * 0.1) : 0);
  mage.rotation.x = blasted ? -0.05 * Math.exp(-blastT * 3) : 0;
  head.rotation.x = lerp(0.12, -0.05, ss(1.0, 2.4, t)) + (blasted ? -0.08 * Math.exp(-blastT * 3) : 0);
  head.rotation.y = Math.sin(t * 0.7) * 0.04;

  // arms
  const [sx, so, ex] = armPose(t);
  const tremble = ss(5, 7.4, t) * (t < 7.6 ? 1 : 0) * 0.02;
  for (const a of arms) {
    a.shoulder.rotation.set(sx + Math.sin(t * 40 + a.s) * tremble, 0, a.s * so);
    a.elbow.rotation.x = ex;
    a.handGlow.material.opacity = ss(1.5, 2.6, t) * (blasted ? Math.max(0.3, 1 - blastT) : 1) * (0.8 + 0.2 * Math.sin(t * 13 + a.s));
    a.handGlow.material.color.setHex(0xb070ff).multiplyScalar(1.2 + ss(4, 7.4, t) * 1.5);
  }

  // eyes ignite
  const eye = t < 0.6 ? 0.15 : 0.15 + ss(0.6, 1.0, t) * 5 + Math.sin(t * 6) * 0.6 * ss(1, 2, t) + (blasted ? 4 * Math.exp(-blastT * 2) : 0);
  eyeMat.color.setHex(0xc58cff).multiplyScalar(eye);
  gemMat.color.setHex(0xc58cff).multiplyScalar(0.6 + ss(1.5, 3, t) * 3 + Math.sin(t * 5) * 0.4);

  // cape
  const pos = capeGeo.attributes.position.array;
  const wind = 0.6 + ss(2, 4, t) * 1.2 + (blasted ? 3 * Math.exp(-blastT * 1.5) : 0);
  for (let i = 0; i < pos.length; i += 3) {
    const bx = capeBase[i], by = capeBase[i + 1];
    const v = (1.075 - by) / 2.15; // 0 top, 1 bottom
    const flare = 1 + v * 0.75;
    let x = bx * flare, y = 2.24 - v * 2.05, z = -0.36 + 0.24 * Math.pow(bx / 0.65, 2) * (1 - v * 0.4);
    const wave = Math.sin(t * 2.4 + by * 3.2 + bx * 2.1) * 0.06 + Math.sin(t * 4.1 + bx * 4 - by * 2) * 0.025;
    z -= v * v * (wave * wind + 0.12 * wind);
    x += Math.sin(t * 1.7 + by * 2) * 0.04 * v * wind;
    y += v * v * 0.08 * (wind - 0.6);
    pos[i] = x; pos[i + 1] = y; pos[i + 2] = z;
  }
  capeGeo.attributes.position.needsUpdate = true; capeGeo.computeVertexNormals();

  // runes
  const runeOn = ss(1.4, 2.6, t) * (blasted ? 0.6 + 0.4 * Math.exp(-blastT * 2) : 1);
  runeGround.material.opacity = runeOn * (0.85 + 0.15 * Math.sin(t * 9));
  runeGround.rotation.z = t * 0.35;
  runeGround.scale.setScalar(0.4 + 0.6 * easeOut((t - 1.4) / 1.4) + (blasted ? blastT * 0.08 : 0));
  runeGround2.material.opacity = ss(2.2, 3.4, t) * 0.55 * (blasted ? Math.exp(-blastT * 0.8) * 0.7 + 0.3 : 1);
  runeGround2.rotation.z = -t * 0.18;
  runeLight.intensity = runeOn * 14 + (blasted ? 18 * Math.exp(-blastT * 4) : 0);

  // floating debris
  for (const m of rocks) {
    const u = m.userData, lift = ss(2.8 + u.delay, 6.2 + u.delay, t);
    let rr = u.rr, a = u.a + lift * 0.6 + t * 0.05 * lift;
    if (blasted) rr += easeOut(blastT / 1.4) * (0.8 + u.sz * 2) * (Math.sin(a) > 0 ? 0.5 : 1.6);
    m.position.set(Math.cos(a) * rr, 0.25 + u.sz * 0.6 + lift * u.rise + Math.sin(t * 1.3 + u.ph) * 0.08 * lift, Math.sin(a) * rr);
    m.rotation.set(u.spin.x * t * lift * 2, u.spin.y * t * lift * 2, u.spin.z * t * lift);
  }

  // orb
  const grow = ss(3.9, 7.3, t);
  let orbR = grow * 0.2 * (1 + 0.08 * Math.sin(t * 17));
  orb.position.copy(ORB_POS);
  if (blasted) { orbR *= Math.max(0, 1 - blastT * 6); orb.position.z += blastT * 30; }
  orb.visible = orbR > 0.002;
  orb.scale.setScalar(Math.max(orbR, 0.001));
  orbShell.rotation.set(t * 1.9, t * 2.7, 0); orbShell2.rotation.set(-t * 1.3, t * 0.9, t);
  orbGlow.material.opacity = 0.7 + 0.3 * Math.sin(t * 11);
  orbLight.position.copy(ORB_POS);
  orbLight.intensity = (blasted ? 0 : grow) * (9 + 4 * Math.sin(t * 13)) + (blasted ? 45 * Math.exp(-blastT * 3.5) : 0);

  // spell seal in front of orb
  const sealOn = ss(4.4, 5.4, t);
  seal.position.set(ORB_POS.x, ORB_POS.y, ORB_POS.z + 0.35 + (blasted ? easeOut(blastT / 0.6) * 1.2 : 0));
  seal.lookAt(camera.position.x * 0.2, ORB_POS.y, 50);
  seal.rotateZ(t * 1.2);
  seal.scale.setScalar(0.3 + sealOn * 0.7 + (blasted ? easeOut(blastT / 0.6) * 1.2 : 0));
  seal.material.opacity = sealOn * (blasted ? Math.max(0, 1 - blastT / 0.5) : 0.9 + 0.1 * Math.sin(t * 20));

  // lightning hands -> orb
  scene.updateMatrixWorld(true);
  const boltOn = ss(4.2, 4.8, t) * (t < 7.6 ? 1 : 0);
  const frame = Math.floor(t * 30);
  bolts.forEach((b, i) => {
    b.geometry.dispose();
    const flick = mulberry32(frame * 13 + i * 7)() > 0.35;
    if (boltOn > 0 && flick) {
      let from;
      if (i < 4) { arms[i % 2].hand.getWorldPosition(tmpV); from = tmpV.clone(); }
      else { from = ORB_POS.clone().add(new THREE.Vector3(Math.sin(frame) * 1.2, -1.5, Math.cos(frame * 1.7) * 0.6)); }
      b.geometry = boltGeometry(from, ORB_POS, frame * 31 + i, 0.25 + 0.15 * (i % 2));
      b.visible = true;
    } else { b.geometry = new THREE.BufferGeometry(); b.visible = false; }
  });
  boltMat.opacity = boltOn;

  // spiral particles (converge into orb), then burst outward
  const sp = spiral.geometry.attributes.position.array, sc = spiral.geometry.attributes.color.array;
  const spOn = ss(1.8, 3.2, t);
  const cA = new THREE.Color(0xa060ff), cB = new THREE.Color(0x50d0ff), cW = new THREE.Color(0xffffff), c = new THREE.Color();
  for (let i = 0; i < N_SPIRAL; i++) {
    const s = spiralSeed[i];
    let x, y, z, bright;
    if (!blasted) {
      const p = (t * s.sp + s.off) % 1;
      const r = s.r * Math.pow(1 - p, 1.6) * (1 - grow * 0.15);
      const ang = s.a + p * 7 + t * 0.4;
      x = ORB_POS.x + Math.cos(ang) * r; z = ORB_POS.z * p + Math.sin(ang) * r; y = lerp(0.3 + s.h * 0.4, ORB_POS.y, Math.pow(p, 0.7));
      bright = spOn * Math.sin(Math.PI * p) * (0.6 + 0.8 * grow);
      c.copy(cA).lerp(s.hue > 0.7 ? cB : cW, p * 0.6);
    } else {
      const d = easeOut(blastT / 2.2) * s.bsp;
      x = ORB_POS.x + s.dir.x * d; y = Math.max(0.3, ORB_POS.y + s.dir.y * d - blastT * blastT * 0.3); z = ORB_POS.z + s.dir.z * d + d * 0.5;
      bright = Math.exp(-blastT * 1.6) * 2.2;
      c.copy(s.hue > 0.5 ? cA : cB).lerp(cW, Math.exp(-blastT * 3));
    }
    sp[i * 3] = x; sp[i * 3 + 1] = y; sp[i * 3 + 2] = z;
    sc[i * 3] = c.r * bright; sc[i * 3 + 1] = c.g * bright; sc[i * 3 + 2] = c.b * bright;
  }
  spiral.geometry.attributes.position.needsUpdate = true; spiral.geometry.attributes.color.needsUpdate = true;

  // ambient embers
  const ep = embers.geometry.attributes.position.array, ec = embers.geometry.attributes.color.array;
  const cE1 = new THREE.Color(0xff8a40), cE2 = new THREE.Color(0xb070ff);
  for (let i = 0; i < N_EMBER; i++) {
    const s = emberSeed[i], p = (t * s.sp * (1 + ss(2, 5, t)) + s.off) % 1;
    ep[i * 3] = s.x + Math.sin(t + s.sway) * 0.3 + (blasted ? s.x * easeOut(blastT) * 0.3 : 0);
    ep[i * 3 + 1] = p * 7; ep[i * 3 + 2] = s.z;
    const b = Math.sin(Math.PI * p) * 1.4;
    c.copy(cE1).lerp(cE2, ss(1.5, 4, t) * s.warm);
    ec[i * 3] = c.r * b; ec[i * 3 + 1] = c.g * b; ec[i * 3 + 2] = c.b * b;
  }
  embers.geometry.attributes.position.needsUpdate = true; embers.geometry.attributes.color.needsUpdate = true;

  // shockwaves
  shock.visible = shock2.visible = blasted;
  if (blasted) {
    shock.scale.setScalar(0.5 + easeOut(blastT / 1.6) * 22); shock.material.opacity = 0.55 * Math.max(0, 1 - blastT / 1.6);
    shock2.scale.setScalar(0.2 + easeOut(blastT / 0.9) * 9); shock2.material.opacity = 0.6 * Math.max(0, 1 - blastT / 0.9);
    shock2.lookAt(camera.position);
  }

  // bloom intensity rises with the spell
  bloom.strength = 0.75 + grow * 0.1 + (blasted ? 0.9 * Math.exp(-blastT * 3) : 0);

  // overlays
  flash.material.opacity = blasted ? Math.min(1, blastT / 0.06) * Math.exp(-blastT * 4.5) * 0.85 : 0;
  fade.material.opacity = Math.max(1 - ss(0, 0.9, t), ss(9.45, 10, t));
  title.material.opacity = ss(8.5, 9.1, t) * (1 - ss(9.5, 9.95, t));

  composer.render();
}

window.renderAt = renderAt;
window.ready = true;
if (!location.search.includes('capture')) {
  const start = performance.now();
  renderer.setAnimationLoop(() => renderAt(((performance.now() - start) / 1000) % DURATION));
}
</script>
</body>
</html>
