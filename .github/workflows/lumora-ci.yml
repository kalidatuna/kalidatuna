name: Lumora CI

on:
  push:
    paths: ["lumora/**", ".github/workflows/lumora-ci.yml"]
  pull_request:
    paths: ["lumora/**", ".github/workflows/lumora-ci.yml"]

defaults:
  run:
    working-directory: lumora

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ["12111:12111"]
    env:
      STRIPE_MOCK_URL: http://localhost:12111
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: lumora/server }
      - run: cd server && cargo fmt --check
      - run: cd server && cargo clippy --all-targets -- -D warnings
      - run: cd server && cargo test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: lumora/web/package-lock.json }
      - run: cd web && npm ci && npm run typecheck && npm test && npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: lumora/server }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd web && npm ci && npm run build
      - run: cd server && cargo build --release
      - run: cd e2e && npm ci && npx playwright install --with-deps chromium
      - run: cd e2e && npx playwright test --trace off

  docker:
    runs-on: ubuntu-latest
    needs: [server, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t lumora:ci .
      - run: |
          docker run -d --name lumora -p 8080:8080 lumora:ci
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && exit 0; sleep 1; done
          docker logs lumora; exit 1
