name: checks

on:
  push:
  pull_request:

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate n8n workflow exports
        run: python scripts/check_workflows.py
      - name: Check relative Markdown links
        run: python scripts/check_links.py
